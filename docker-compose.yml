# Passerelle WhatsApp (Evolution API) — reprise de la stack AthenIA.
# Le bot PrintBot tourne sur le Mac (il a besoin de Claude Code, du plugin Bambu
# et d'OpenSCAD), Evolution l'appelle via host.docker.internal.

name: printbot

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 5s
      retries: 10

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    ports:
      - "127.0.0.1:8085:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SERVER_TYPE=http
      - SERVER_PORT=8080
      - SERVER_URL=http://localhost:8085
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-printbot-dev-key-change-me}
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:evolution_dev_password@postgres:5432/evolution
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=false
      - DATABASE_SAVE_DATA_CONTACTS=false
      - CACHE_LOCAL_ENABLED=true
      - CACHE_REDIS_ENABLED=false
      # Messages entrants → PrintBot sur le Mac
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_URL=${WEBHOOK_PUBLIC_URL:-http://host.docker.internal:4100/webhook}
      - WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS=false
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
      - CHATWOOT_ENABLED=false
      - LOG_LEVEL=WARN
      - LOG_BAILEYS=error
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  evolution_instances:
